<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智能指南针 - 界面预览</title>
<style>
  :root{--bg:#0B0F14;--card:#141A22;--line:#2A3440;--txt:#ECEFF1;--sub:#90A4AE;--blue:#4FC3F7;--red:#E53935;--green:#66BB6A;}
  body{background:#05070a;color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",sans-serif;margin:0;padding:24px;}
  h1{font-size:20px;text-align:center;}
  .row{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;}
  .phone{width:300px;height:600px;background:var(--bg);border-radius:32px;border:6px solid #222;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;}
  .label{text-align:center;color:var(--sub);font-size:13px;margin-top:8px;}
  .dial{position:relative;width:240px;height:240px;margin:12px auto;border-radius:50%;background:radial-gradient(circle at 50% 40%,#182029,#10151c);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;}
  .needle{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:6px;height:56px;background:linear-gradient(#E53935 50%,#B0BEC5 50%);border-radius:3px;}
  .n{position:absolute;top:6px;left:50%;transform:translateX(-50%);color:#E53935;font-weight:700;}
  .s{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);color:var(--sub);}
  .e{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--sub);}
  .w{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--sub);}
  .deg{font-size:52px;font-weight:800;text-align:center;margin-top:10px;}
  .dir{text-align:center;color:var(--sub);font-size:16px;}
  .meta{text-align:center;color:#607D8B;font-size:12px;margin-top:8px;}
  .chips{display:flex;gap:6px;justify-content:center;margin-top:6px;}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 10px;font-size:12px;color:var(--sub);}
  .chip.ok{color:var(--green);}
  .tabbar{margin-top:auto;display:flex;background:var(--card);border-radius:14px;padding:6px;}
  .tab{flex:1;text-align:center;font-size:13px;color:#607D8B;padding:8px 0;border-radius:10px;}
  .tab.on{background:#1E2833;color:var(--blue);font-weight:700;}
  .level{width:240px;height:240px;margin:20px auto;border-radius:50%;border:2px solid var(--line);position:relative;background:var(--card);}
  .ring{position:absolute;inset:33%;border:1px solid var(--line);border-radius:50%;}
  .ring2{position:absolute;inset:16%;border:1px solid var(--line);border-radius:50%;}
  .bubble{position:absolute;width:44px;height:44px;border-radius:50%;background:var(--blue);opacity:.9;top:118px;left:128px;}
  .lvldeg{font-size:48px;font-weight:800;text-align:center;color:var(--green);}
  .cal8{width:220px;height:150px;margin:16px auto;border:2px solid var(--line);border-radius:12px;position:relative;overflow:hidden;}
  .cal8 svg{width:100%;height:100%;}
  .bar{width:80%;margin:10px auto;height:10px;border-radius:6px;background:#1C2530;overflow:hidden;}
  .bar>i{display:block;height:100%;width:42%;background:var(--green);border-radius:6px;}
</style>
</head>
<body>
<h1>智能指南针 CompassApp · 三大界面预览（还原 Compose 实现效果）</h1>
<div class="row">
  <div>
    <div class="phone">
      <div class="chips"><span class="chip">磁北</span><span class="chip ok">磁场 48 μT</span></div>
      <div class="dial"><div class="n">北</div><div class="s">南</div><div class="e">东</div><div class="w">西</div><div class="needle"></div></div>
      <div class="deg">358°</div>
      <div class="dir">北 · 磁北</div>
      <div class="meta">俯仰 +1° 横滚 -2°</div>
      <div class="tabbar"><div class="tab on">指南针</div><div class="tab">水平仪</div><div class="tab">校准</div></div>
    </div>
    <div class="label">① 指南针：表盘 + 角度读数 + 磁场监测</div>
  </div>
  <div>
    <div class="phone">
      <div class="level"><div class="ring2"></div><div class="ring"></div><div class="bubble"></div></div>
      <div class="lvldeg">0.4°</div>
      <div class="dir" style="color:var(--green)">✓ 完全水平</div>
      <div class="meta">左右 -0.2° 前后 +0.3°</div>
      <div class="tabbar"><div class="tab">指南针</div><div class="tab on">水平仪</div><div class="tab">校准</div></div>
    </div>
    <div class="label">② 水平仪：气泡式，1° 内变绿提示</div>
  </div>
  <div>
    <div class="phone">
      <div style="text-align:center;font-size:20px;font-weight:700;margin-top:10px">传感器校准</div>
      <div style="color:var(--sub);font-size:13px;text-align:center;padding:0 12px;margin-top:6px">手持手机在空中按轨迹画"8"字，重复 10~20 秒，远离磁性物体</div>
      <div class="cal8">
        <svg viewBox="0 0 200 130"><path d="M100,65 C160,10 160,120 100,65 C40,10 40,120 100,65" fill="none" stroke="#4FC3F7" stroke-width="4" stroke-linecap="round"/></svg>
      </div>
      <div class="bar"><i></i></div>
      <div style="text-align:center;color:var(--green);font-size:13px">当前磁场强度：48 μT（正常 25~65）</div>
      <div style="text-align:center;font-size:14px;margin-top:10px">传感器：状态良好</div>
      <div class="tabbar"><div class="tab">指南针</div><div class="tab">水平仪</div><div class="tab on">校准</div></div>
    </div>
    <div class="label">③ 校准：8 字引导 + 磁场仪表</div>
  </div>
</div>
</body>
</html>
